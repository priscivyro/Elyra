name: Construire ELYRA
# 0. Teste l'appli (si un test échoue, rien n'est publié).
# 1. Génère la voix ELYRA (Piper, gratuit) — seules les nouvelles phrases sont calculées.
# 2. Publie l'appli iPhone sur https://priscivyro.github.io/Elyra/
# 3. Fabrique l'APK Android et le publie dans « Releases ».

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tester l'appli et la conversation
        run: |
          mkdir -p /tmp/t && cd /tmp/t && npm init -y >/dev/null && npm i jsdom@24 >/dev/null
          cp $GITHUB_WORKSPACE/tests/*.js /tmp/t/
          (cd $GITHUB_WORKSPACE/www && python3 -m http.server 8766 >/dev/null 2>&1 &)
          sleep 2
          node app.test.js http://localhost:8766/index.html
          node chat.test.js $GITHUB_WORKSPACE/chat/index.html | tee chat.log
          grep -q "TOUT EST OK" chat.log
          node voix.test.js http://localhost:8766/index.html
          node $GITHUB_WORKSPACE/tests/worker.test.mjs

  # Petit serveur gratuit (Cloudflare) pour la conversation à voix haute.
  # Ne fait rien tant que les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID n'existent pas.
  serveur:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.dep.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: dep
        name: Déployer le serveur ELYRA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Pas de clé Cloudflare : la conversation à voix haute n'est pas encore activée."; exit 0; fi
          cd worker
          npx --yes wrangler@4 deploy 2>&1 | tee ../deploy.log
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.workers\.dev' ../deploy.log | head -1)
          echo "Adresse : $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  voix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reprendre les audios déjà générés
        uses: actions/cache@v4
        with:
          path: voix-cache
          key: voix-v2-${{ hashFiles('www/content.js', 'tools/voix/**') }}
          restore-keys: voix-v2-
      - name: Installer Piper et ffmpeg
        run: |
          pip install piper-tts==1.8.0
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p modeles && python -m piper.download_voices fr_FR-siwis-medium fr_FR-tom-medium --data-dir modeles
      - name: Générer les voix (féminine et masculine)
        run: |
          node tools/voix/lignes.mjs > lignes.json
          python tools/voix/render.py modeles/fr_FR-siwis-medium.onnx lignes.json voix-cache/siwis 1.18
          python tools/voix/render.py modeles/fr_FR-tom-medium.onnx lignes.json voix-cache/tom 1.12
          du -sh voix-cache/*
      - uses: actions/upload-artifact@v4
        with:
          name: voix
          path: voix-cache
          retention-days: 7

  web:
    needs: [voix, tests, serveur]
    if: always() && needs.tests.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: voix
          path: www/voix
      - name: Adresse du serveur ELYRA
        if: needs.serveur.outputs.url != ''
        run: echo "window.ELYRA_CONFIG={voix:'${{ needs.serveur.outputs.url }}'};" > www/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    needs: [voix, tests, serveur]
    if: always() && needs.tests.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: voix
          path: www/voix
      - name: Adresse du serveur ELYRA
        if: needs.serveur.outputs.url != ''
        run: echo "window.ELYRA_CONFIG={voix:'${{ needs.serveur.outputs.url }}'};" > www/config.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dépendances
        run: npm ci
      - name: Préparer le projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#f7f2e9' --iconBackgroundColorDark '#1c1a20' --splashBackgroundColor '#f7f2e9' --splashBackgroundColorDark '#1c1a20'
          npx cap sync android
      # Toujours la même signature : les mises à jour s'installent par-dessus sans perdre les données.
      - name: Signature fixe et numéro de version
        run: python3 tools/android/configure.py $((100 + ${{ github.run_number }})) 1.4.${{ github.run_number }}
      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ELYRA.apk
      - name: Vérifier la signature
        run: |
          keytool -exportcert -keystore signing/debug.keystore -storepass android -alias androiddebugkey -file cle.der
          python3 -c "import sys;sys.exit(0 if open('cle.der','rb').read() in open('ELYRA.apk','rb').read() else 'APK pas signé avec la clé ELYRA')"
      - uses: actions/upload-artifact@v4
        with:
          name: ELYRA-apk
          path: ELYRA.apk
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.${{ github.run_number }}
          name: ELYRA pour Android (version 1.4.${{ github.run_number }})
          make_latest: true
          files: ELYRA.apk
          body: |
            Télécharge **ELYRA.apk** sur ton téléphone Android et ouvre-le pour l'installer (par-dessus l'ancienne version, tes données sont gardées).
            Lien direct toujours à jour : https://github.com/${{ github.repository }}/releases/latest/download/ELYRA.apk
