name: Construire ELYRA
# 0. Teste l'appli (si un test échoue, rien n'est publié).
# 1. Génère la voix ELYRA (Piper, gratuit) — seules les nouvelles phrases sont calculées.
# 2. Publie l'appli iPhone sur https://priscivyro.github.io/Elyra/
# 3. Fabrique l'APK Android et le publie dans « Releases ».

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tester l'appli et la conversation
        run: |
          mkdir -p /tmp/t && cd /tmp/t && npm init -y >/dev/null && npm i jsdom@24 >/dev/null
          cp $GITHUB_WORKSPACE/tests/*.js /tmp/t/
          (cd $GITHUB_WORKSPACE/www && python3 -m http.server 8766 >/dev/null 2>&1 &)
          sleep 2
          node app.test.js http://localhost:8766/index.html
          node chat.test.js $GITHUB_WORKSPACE/chat/index.html | tee chat.log
          grep -q "TOUT EST OK" chat.log
          node voix.test.js http://localhost:8766/index.html
          node $GITHUB_WORKSPACE/tests/worker.test.mjs

  # Petit serveur gratuit (Cloudflare) pour la conversation à voix haute.
  # Ne fait rien tant que les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID n'existent pas.
  serveur:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.dep.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: dep
        name: Déployer le serveur ELYRA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          set -o pipefail
          # Nettoie les secrets (espaces ou retours à la ligne collés par erreur).
          CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-fA-F]{32}' | head -1 || true)
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          export CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN
          # Sans identifiant valide, Wrangler trouve tout seul le compte (la clé n'en voit qu'un).
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; echo "Identifiant de compte absent ou invalide : détection automatique."; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Pas de clé Cloudflare : la conversation à voix haute n'est pas encore activée."; exit 0; fi
          cd worker
          npx --yes wrangler@4 deploy 2>&1 | tee ../deploy.log
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.workers\.dev' ../deploy.log | head -1)
          echo "Adresse : $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # Voix humaine pour la conversation (clé gardée secrète sur le serveur).
          if [ -n "$AZURE_SPEECH_KEY" ]; then
            printf '%s' "$AZURE_SPEECH_KEY" | tr -d '[:space:]' | npx --yes wrangler@4 secret put AZURE_SPEECH_KEY
            printf '%s' "${AZURE_SPEECH_REGION:-westeurope}" | tr -d '[:space:]' | tr 'A-Z' 'a-z' | npx --yes wrangler@4 secret put AZURE_SPEECH_REGION
          fi
      - name: Vérifier le serveur (écoute et réponse, en vrai)
        if: steps.dep.outputs.url != ''
        run: |
          URL="${{ steps.dep.outputs.url }}"
          sudo apt-get install -y -qq espeak-ng >/dev/null
          espeak-ng -v fr -s 140 -w essai.wav "Bonjour ELYRA, je me sens un peu stressée ce soir."
          echo "--- Écoute (Whisper) :"
          curl -s -X POST "$URL/stt" -H "Origin: https://priscivyro.github.io" -H "Content-Type: audio/wav" --data-binary @essai.wav | tee stt.json; echo
          grep -qi "stress" stt.json
          echo "--- Réponse d'ELYRA (Mistral) :"
          curl -sN -X POST "$URL/chat" -H "Origin: https://priscivyro.github.io" -H "Content-Type: application/json" \
            -d '{"mode":"ecoute","genre":"f","memOn":false,"messages":[{"role":"user","content":"Je me sens un peu stressée ce soir."}]}' \
            | sed -n 's/^data: //p' | grep -v DONE | python3 -c "import sys,json;print(''.join((lambda j:j.get('response') or ((j.get('choices') or [{}])[0].get('delta') or {}).get('content') or '')(json.loads(l)) for l in sys.stdin if l.strip()))" | tee rep.txt
          test -s rep.txt
          echo "--- Voix humaine :"
          curl -s "$URL/ping"; echo
          if curl -s "$URL/ping" | grep -q '"tts":true'; then
            curl -s -X POST "$URL/tts" -H "Origin: https://priscivyro.github.io" -H "Content-Type: application/json" -d '{"text":"Bonjour, je suis là."}' -o tts.mp3 -w "HTTP %{http_code}, %{size_download} octets\n"
            test "$(stat -c%s tts.mp3)" -gt 2000
          fi

  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reprendre les audios déjà générés
        uses: actions/cache@v4
        with:
          path: voix-cache
          key: voix-v3-${{ secrets.AZURE_SPEECH_KEY != '' && 'az' || 'pi' }}-${{ hashFiles('www/content.js', 'www/seances.js', 'tools/voix/**') }}
          restore-keys: |
            voix-v3-${{ secrets.AZURE_SPEECH_KEY != '' && 'az' || 'pi' }}-
            voix-v3-
            voix-v2-
      - name: Installer Piper et ffmpeg
        run: |
          pip install piper-tts==1.8.0
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p modeles && python -m piper.download_voices fr_FR-siwis-medium fr_FR-tom-medium --data-dir modeles
      - name: Générer les voix (féminine et masculine)
        run: |
          node tools/voix/lignes.mjs > lignes.json
          # La voix Piper féminine est gardée à part : la voix des séances = voix C + Piper en secours.
          [ -d voix-cache/siwis-piper ] || { [ -d voix-cache/siwis ] && mv voix-cache/siwis voix-cache/siwis-piper || true; }
          python tools/voix/render.py modeles/fr_FR-siwis-medium.onnx lignes.json voix-cache/siwis-piper 1.18
          python tools/voix/render.py modeles/fr_FR-tom-medium.onnx lignes.json voix-cache/tom 1.12
          mkdir -p voix-cache/modele && cp modeles/fr_FR-siwis-medium.onnx* modeles/fr_FR-tom-medium.onnx* voix-cache/modele/ && ls -la voix-cache/modele
      - name: Voix C (Chatterbox) pour les séances, quand elle est prête
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/voixc
          gh release download voix-c -p voix-c.zip -R "$GITHUB_REPOSITORY" -D /tmp && unzip -q -o /tmp/voix-c.zip -d /tmp/voixc || echo "Pas encore de voix C : voix Piper."
          python tools/voix/fusion_seances.py voix-cache/siwis-piper /tmp/voixc voix-cache/siwis
      - name: Voix humaines Microsoft (si le compte gratuit est configuré)
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ]; then echo "Pas de clé Azure : les séances gardent la voix Piper."; exit 0; fi
          python tools/voix/azure.py lignes.json voix-cache/vivienne fr-FR-VivienneMultilingualNeural fr-FR-DeniseNeural
          python tools/voix/azure.py lignes.json voix-cache/remy fr-FR-RemyMultilingualNeural fr-FR-HenriNeural
          du -sh voix-cache/*
          du -sh voix-cache/*
      - uses: actions/upload-artifact@v4
        with:
          name: voix
          path: |
            voix-cache
            !voix-cache/siwis-piper
          retention-days: 7

  # Vraie voix naturelle, calculée dans un vrai navigateur (Chrome) : vérification.
  voixtest:
    needs: voix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: voix
          path: www/voix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tester la voix naturelle
        run: |
          npm ci && sh tools/vendor.sh
          (cd www && python3 -m http.server 8766 >/dev/null 2>&1 &)
          mkdir -p /tmp/p && cd /tmp/p && npm init -y >/dev/null && npm i puppeteer-core@24 >/dev/null
          cp $GITHUB_WORKSPACE/tests/piper.test.js . && sleep 1
          CHROME=$(which google-chrome || which chromium) node piper.test.js http://localhost:8766/index.html

  web:
    needs: [voix, tests, serveur]
    if: always() && needs.tests.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: voix
          path: www/voix
      - name: Adresse du serveur ELYRA
        if: needs.serveur.outputs.url != ''
        run: echo "window.ELYRA_CONFIG={voix:'${{ needs.serveur.outputs.url }}'};" > www/config.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Moteurs de la voix naturelle
        run: npm ci && sh tools/vendor.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Nouvel essai si GitHub a eu un raté
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

  apk:
    needs: [voix, tests, serveur]
    if: always() && needs.tests.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: voix
          path: www/voix
      - name: Adresse du serveur ELYRA
        if: needs.serveur.outputs.url != ''
        run: echo "window.ELYRA_CONFIG={voix:'${{ needs.serveur.outputs.url }}'};" > www/config.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: L'APK télécharge la voix naturelle au besoin (il reste léger)
        run: |
          rm -rf www/voix/modele www/vendor
          # Si les séances existent en voix humaine complète, l'APK n'embarque pas les anciennes voix.
          python3 -c "import json,sys;sys.exit(0 if all(json.load(open(f'www/voix/{d}/index.json')).get('complete') for d in ('vivienne','remy')) else 1)" 2>/dev/null && rm -rf www/voix/siwis www/voix/tom || true
          du -sh www/voix || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dépendances
        run: npm ci
      - name: Préparer le projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#23264F' --iconBackgroundColorDark '#14162F' --splashBackgroundColor '#F8F5F2' --splashBackgroundColorDark '#1B1B30'
          npx cap sync android
      # Toujours la même signature : les mises à jour s'installent par-dessus sans perdre les données.
      - name: Signature fixe et numéro de version
        run: |
          V=$(grep -oP 'APP_VERSION="\K[0-9]+\.[0-9]+' www/app.js)
          echo "APPV=$V" >> $GITHUB_ENV
          python3 tools/android/configure.py $((100 + ${{ github.run_number }})) $V.${{ github.run_number }}
      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ELYRA.apk
      - name: Vérifier la signature
        run: |
          keytool -exportcert -keystore signing/debug.keystore -storepass android -alias androiddebugkey -file cle.der
          python3 -c "import sys;sys.exit(0 if open('cle.der','rb').read() in open('ELYRA.apk','rb').read() else 'APK pas signé avec la clé ELYRA')"
      - uses: actions/upload-artifact@v4
        with:
          name: ELYRA-apk
          path: ELYRA.apk
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APPV }}.${{ github.run_number }}
          name: ELYRA pour Android (version ${{ env.APPV }}.${{ github.run_number }})
          make_latest: true
          files: ELYRA.apk
          body: |
            Télécharge **ELYRA.apk** sur ton téléphone Android et ouvre-le pour l'installer (par-dessus l'ancienne version, tes données sont gardées).
            Lien direct toujours à jour : https://github.com/${{ github.repository }}/releases/latest/download/ELYRA.apk
