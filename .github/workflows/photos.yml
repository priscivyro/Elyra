name: Planches photos
# Prépare des planches de photos libres de droits pour choisir les images d'ELYRA.
on:
  push:
    paths: ['tools/photos/planches.py', '.github/workflows/photos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  planches:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pillow
      - run: python tools/photos/planches.py
      - name: Ranger dans la branche « photos-planches »
        run: |
          mkdir -p /tmp/out && cp planches/* /tmp/out/
          git config user.name "ELYRA" && git config user.email "elyra@users.noreply.github.com"
          git checkout --orphan photos-planches && git rm -rfq . && cp /tmp/out/* . && git add .
          git commit -qm "Planches photos" && git push -f origin photos-planches
