name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer le projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#f7f2e9' --iconBackgroundColorDark '#1c1a20' --splashBackgroundColor '#f7f2e9' --splashBackgroundColorDark '#1c1a20'
          npx cap sync android

      # Toujours la même signature : les mises à jour s'installent par-dessus sans perdre les données.
      - name: Clé de signature fixe
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ELYRA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ELYRA-apk
          path: ELYRA.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ELYRA pour Android (version ${{ github.run_number }})
          make_latest: true
          files: ELYRA.apk
          body: |
            Télécharge **ELYRA.apk** sur ton téléphone Android et ouvre-le pour l'installer.
            Lien direct toujours à jour : https://github.com/${{ github.repository }}/releases/latest/download/ELYRA.apk
